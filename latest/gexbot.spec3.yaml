  /tickers/quant:
    get:
      summary: List Quant ticker symbols
      description: |
        Returns the additional stock and index ticker symbols that the realtime WebSocket feed publishes for Quant subscribers. The route needs no API key. The /v2 form still requires the User-Agent header. These tickers are WebSocket/PubSub-only: they publish standard realtime groups and explicit-expiry realtime groups. They are not valid on the REST chart or history routes. Only a Quant subscription can subscribe to these tickers.
      tags:
        - Public
      security: []
      parameters:
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      responses:
        "200":
          description: Quant ticker symbols.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/quant_tickers_response"
              example:
                stocks:
                  - SOXL
                  - LLY
                  - FUTU
                indexes:
                  - XSP
        "400":
          $ref: "#/components/responses/400"
  /options/{ticker}/expiries:
    get:
      summary: List all valid option expiries for realtime expiry groups
      description: |
        Returns all valid option expiration dates for a canonical option-owning ticker over the currently-published horizon: the current Eastern calendar date through current Eastern date + 90 calendar days.

        Use the returned `YYYY-MM-DD` dates to build explicit-expiry WebSocket group suffixes. Remove the dashes, e.g. `2026-07-17` becomes `20260717`. Use canonical option-owning tickers such as `SPX`, `NDX`, `SPY`, `QQQ`, Quant-only stock tickers, or the Quant-only `XSP` index.
      tags:
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/option_ticker_in_path"
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      responses:
        "200":
          description: All valid option expiries for the ticker within the published horizon.
          headers:
            Cache-Control:
              description: A cache can keep the response for 12 hours.
              schema:
                type: string
                example: public, max-age=43200
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/option_expiries_response"
              example:
                ticker: SPX
                start_date: '2026-07-10'
                end_date: '2026-10-08'
                expiries:
                  - '2026-07-10'
                  - '2026-07-13'
                  - '2026-07-15'
                  - '2026-07-17'
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
        "503":
          description: Service Unavailable. The upstream options reference data is not available. Retry later.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
  /futures/conversion:
    get:
      summary: Convert a cash ticker price to a synthetic futures price
      description: |
        Returns the terms that convert a cash ticker price to a synthetic futures price. Multiply the cash price by `multiplier`, then add `additive`.

        The service fits the terms over the most recent 30 minutes of 1-minute data. Synthetic futures tickers such as `ES_SPX` are not valid source tickers.
      tags:
        - Classic
        - State
        - Orderflow
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - name: ticker
          in: query
          required: true
          description: 'Cash source ticker. Use one of the supported pairs: SPX/ES, SPY/ES, NDX/NQ, QQQ/NQ, RUT/RTY, IWM/RTY, DIA/YM, GLD/GC, SLV/SI, USO/CL.'
          schema:
            $ref: "#/components/schemas/futures_conversion_ticker"
        - name: future
          in: query
          required: true
          description: Futures root to convert to. It must match the pair of `ticker`.
          schema:
            $ref: "#/components/schemas/synth_future_ticker"
        - name: model
          in: query
          required: false
          description: Conversion model. An omitted model defaults to `additive` for an index source ticker and `affine` for a stock source ticker.
          schema:
            $ref: "#/components/schemas/futures_conversion_model"
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      responses:
        "200":
          description: The futures conversion terms.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/futures_conversion_response"
              example:
                future_contract: ESH6
                multiplier: 1
                additive: 34.25
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          description: Not Found. No spot data, no futures bars, no active contract, or fewer than 10 matched minutes for the conversion window.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              example:
                error: No active futures contract found for product.
        "429":
          $ref: "#/components/responses/429"
        "503":
          description: Service Unavailable. The upstream futures data did not answer, or a refresh of the same pair is in progress. Retry after a short delay.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              example:
                error: Futures conversion is currently being refreshed. Try again shortly.
  /hist/{ticker}/{package}/{category}/{date}:
    get:
      summary: Download historical data for a specific ticker, package, category, and date
      description: Generates a pre-signed URL to download historical data (JSON) for a specific date. Data is available for a 90-day look-back window. By default, this endpoint returns a 302 Redirect to the file. To receive a JSON response that contains the URL instead, include the noredirect query parameter. The file is a gzip JSON file (.json.gz). The download URL is valid for 10 minutes.
      tags:
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/ticker_in_path"
        - $ref: "#/components/parameters/package_in_path"
        - $ref: "#/components/parameters/category_in_path"
        - name: date
          in: path
          required: true
          schema:
            type: string
            pattern: ^\d{4}-\d{2}-\d{2}$
          description: The date to query in YYYY-MM-DD format.
        - name: noredirect
          in: query
          required: false
          schema:
            type: string
          description: Optional. If included, returns a JSON object with the URL instead of a 302 redirect.
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      responses:
        "200":
          description: OK. Sent when the request has the noredirect query parameter.
          content:
            application/json:
              schema:
                type: object
                required:
                  - url
                properties:
                  url:
                    type: string
                    format: uri
                    description: The pre-signed URL of the history file. The URL is valid for 10 minutes and grants read access only.
        "302":
          description: Redirect to the pre-signed download URL. Sent when the request has no noredirect query parameter.
          headers:
            Location:
              description: The pre-signed download URL. Valid for 10 minutes.
              schema:
                type: string
                format: uri
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          description: Not Found. No file exists for the date.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              example:
                error: Data not found for date requested.
        "429":
          $ref: "#/components/responses/429"
  /hist/eod/{ticker}:
    get:
      summary: Download the latest end-of-day report for a ticker
      description: |
        Returns a ZIP archive with the most recent end-of-day files that exist for the ticker. The archive holds only the packages that your subscription includes.

        The report for the current Eastern date is eligible from 17:00 Eastern time and is included after the nightly cold-storage export has completed. Until then the endpoint returns the most recent earlier report. The report date is in the Content-Disposition file name.
      tags:
        - Classic
        - State
        - Orderflow
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/ticker_in_path"
        - $ref: "#/components/parameters/user_agent_header"
        - name: Accept
          in: header
          required: false
          schema:
            type: string
            enum:
              - application/zip
          description: Optional. Set to "application/zip".
      responses:
        "200":
          description: The end-of-day ZIP report.
          headers:
            Content-Disposition:
              description: Attachment header with the file name `eod_report_{ticker}_{date}.zip`.
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "404":
          description: Not Found. No end-of-day report exists for the ticker.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              example:
                error: EOD report not found.
        "429":
          $ref: "#/components/responses/429"
        "503":
          description: Service Unavailable. The storage fetch failed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
  /research/{ticker}/{metric}:
    get:
      summary: Get research chart data for a ticker and metric
      description: Returns research chart data for the ticker and the metric. The query parameters select the output format, the chart view and the data filters.
      security:
        - bearer_auth: []
      tags:
        - Research
      parameters:
        - $ref: "#/components/parameters/research_ticker_in_path"
        - name: metric
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/research_metric"
        - $ref: "#/components/parameters/user_agent_header"
        - name: Accept
          in: header
          required: true
          schema:
            type: string
            enum:
              - application/json
              - text/csv
          description: Set to "application/json", or "text/csv" for the csv format.
        - name: format
          in: query
          required: false
          description: Output format. An absent value or an unknown value takes `webp`.
          schema:
            type: string
            default: webp
            enum:
              - png
              - jpeg
              - svg
              - pdf
              - json
              - csv
              - webp
        - name: view
          in: query
          required: false
          description: Chart view. mirror applies to bid_iv, mid_iv and ask_iv (and their iv_* aliases) only. Other metrics fall back to skew.
          schema:
            type: string
            enum:
              - skew
              - term
              - surface
              - mirror
        - name: type
          in: query
          required: false
          description: Series render style. The default depends on the metric. It is `bar` for `oi`, `open_interest`, `volume` and an exposure metric, `scatter` for `parity` and `put_call_parity`, and `line` for every other metric.
          schema:
            type: string
            enum:
              - line
              - histogram
              - scatter
              - bar
        - name: theme
          in: query
          required: false
          description: Chart color theme. Defaults to dark.
          schema:
            type: string
            default: dark
            enum:
              - light
              - dark
        - name: strikes
          in: query
          required: false
          description: Number of strike intervals around the spot price. The default depends on the metric. It is 50 for `oi`, `open_interest` and `volume`, 30 for an exposure metric, and 15 for every other metric. The schema declares no default, because there is no single default. A value outside the range is clamped. A value that is not an integer takes the default.
          schema:
            type: integer
            minimum: 5
            maximum: 250
        - name: start_dte
          in: query
          required: false
          description: Start of the DTE window, inclusive. The default is 0 for every metric. A value outside the range is clamped. A value that is not an integer resets `start_dte` and `end_dte` to their defaults.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
            default: 0
        - name: end_dte
          in: query
          required: false
          description: End of the DTE window, inclusive. The default depends on the metric and the view. It is 64 for `max_pain`, 365 when `view` is `term`, and 98 for every other request. The metric wins, so `max_pain` keeps 64 in the term view. The schema declares no default, because there is no single default. A value outside the range is clamped.
          schema:
            type: integer
            minimum: 0
            maximum: 1000
        - name: expiration_filter
          in: query
          required: false
          schema:
            type: string
        - name: contract_agg
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: expiry_agg
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: skew_adj
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: limit_y
          in: query
          required: false
          schema:
            type: boolean
            default: true
        - name: series
          in: query
          required: false
          description: Series for the term view.
          schema:
            type: string
            enum:
              - moneyness
              - strikes
              - deltas
        - name: contract_filter
          in: query
          required: false
          schema:
            type: string
            enum:
              - calls
              - puts
              - all
        - name: moneyness_filter
          in: query
          required: false
          description: Filter by moneyness or delta band. The default is `ntm` for bid_iv, mid_iv and ask_iv (and their iv_* aliases). Every other metric has no default.
          schema:
            type: string
            enum:
              - atm
              - itm
              - ntm
              - otm
              - d10
              - d15
              - d20
              - d25
      responses:
        "200":
          description: Research chart data response. The png, jpeg, svg, pdf and webp formats return an asset descriptor. The json format returns an array of row objects. The csv format returns text/csv.
          headers:
            Content-Disposition:
              description: Attachment header for the csv and json formats, with the file name `{ticker}_data.csv` or `{ticker}_data.json`.
              schema:
                type: string
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/research_asset_descriptor"
                  - type: array
                    description: Row objects for the json format. Each row has the same columns as the csv output.
                    items:
                      type: object
                      additionalProperties: true
            text/csv:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
        "500":
          description: Internal Server Error. The research service did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              example:
                error: Failed to reach upstream research service.
  /negotiate:
    post:
      summary: Negotiate WebSocket connection URLs and initial groups
      description: |
        Provides real-time, low-latency market data via WebSocket. Send the complete initial set of unprefixed analytics groups and one matching `{ticker}_spot` group for each analytics ticker. The presence of the complete spot-group set selects the V2 hubs. The response returns the authorized `v2_*` hub URLs, and the server auto-joins the requested analytics and spot memberships. Connect to the returned V2 URLs. Do not send client-side `joinGroup` messages for this POST flow.

        Analytics group names use `{ticker}_{package}_{category}`, for example `SPX_classic_gex_full`, `SPX_state_gamma_zero`, or `ES_SPX_orderflow_orderflow`. Explicit-expiry groups use a `YYYYMMDD` category suffix, for example `SOXL_classic_gex_20260717`, `SOXL_state_gamma_20260717`, or `SOXL_orderflow_20260717`. Use `GET /options/{ticker}/expiries` to discover valid expiry dates.

        List each `{ticker}_spot` group once in the POST body. The server places it on every V2 hub that has analytics for that ticker. Analytics and spot are separate groups on the same V2 connections. Spot messages use the `proto.spot` type URL. Correlate analytics and spot by ticker and timestamp. Do not assume an arrival order.

        A POST request with no spot groups remains on the current-generation analytics hubs for compatibility. New custom Quant integrations should use the complete V2 analytics-and-spot flow.

        A standard Quant API key has a default limit of 150 active hub-and-group memberships. Server-expanded spot memberships count toward this limit. Commercial or contracted API keys may have a higher custom group limit.
      tags:
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/websocket_negotiate_request"
            examples:
              groups:
                value:
                  groups:
                    - SPX_classic_gex_full
                    - SPX_state_gamma_zero
                    - SPX_spot
                    - ES_SPX_orderflow_orderflow
                    - ES_SPX_spot
      responses:
        "200":
          description: Authorized V2 hub URLs for the documented analytics-and-spot flow, or current-generation hub URLs for a compatibility request with no spot groups.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/websocket_negotiate_response"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
        "503":
          description: Service Unavailable. The server could not read the option expiry universe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
    patch:
      summary: Replace active WebSocket group subscriptions without a reconnect
      description: |
        Replaces the active group memberships for the current API websocket slot and issues no new WebSocket URLs. The request body is the complete desired membership set. The server removes any membership that the body omits. Each item names the connected hub and the unprefixed group.

        Each group entry must include the V2 hub that the client is connected to and the unprefixed group name. The hub must match the analytics group package and category. Repeat each `{ticker}_spot` membership on every V2 hub that has analytics for that ticker. For example, an SPX Classic group uses `v2_classic`, an SPX standard 0DTE State gamma group uses `v2_state_greeks_zero`, and `SPX_spot` must appear on both hubs when both analytics groups remain active.

        The same group limit as POST negotiation applies to the complete PATCH membership set. A standard Quant API key has a default limit of 150 active hub-and-group memberships. Commercial or contracted API keys may have a higher custom group limit.
      tags:
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/websocket_group_update_request"
            examples:
              replace_groups:
                value:
                  groups:
                    - hub: v2_classic
                      group: SPX_classic_gex_full
                    - hub: v2_classic
                      group: SPX_spot
                    - hub: v2_state_greeks_zero
                      group: SPX_state_gamma_zero
                    - hub: v2_state_greeks_zero
                      group: SPX_spot
                    - hub: v2_orderflow
                      group: ES_SPX_orderflow_orderflow
                    - hub: v2_orderflow
                      group: ES_SPX_spot
      responses:
        "200":
          description: Active websocket group memberships replaced.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/websocket_group_update_response"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "409":
          $ref: "#/components/responses/409"
        "429":
          $ref: "#/components/responses/429"
        "503":
          description: Service Unavailable. The server could not read the option expiry universe.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
    get:
      summary: Legacy WebSocket negotiation with client-side group joins
      deprecated: true
      description: |
        Compatibility flow for clients that send Azure Web PubSub `joinGroup` messages after they connect. The response carries a Deprecation header. Migrate custom integrations to the POST and PATCH flow. Official Orderflow integrations continue to use this flow.
      tags:
        - Quant
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/user_agent_header"
        - $ref: "#/components/parameters/accept_header"
      responses:
        "200":
          description: Legacy WebSocket connection URLs and group prefix.
          headers:
            Deprecation:
              description: Always true. The GET flow is deprecated.
              schema:
                type: string
                example: 'true'
            Warning:
              description: A 299 warning that names the POST replacement.
              schema:
                type: string
                example: 299 - "GET /v2/negotiate will be deprecated soon; use POST with groups"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/websocket_legacy_negotiate_response"
        "400":
          $ref: "#/components/responses/400"
        "401":
          $ref: "#/components/responses/401"
        "403":
          $ref: "#/components/responses/403"
        "429":
          $ref: "#/components/responses/429"
  /whoami:
    get:
      summary: Return the account and the API key of the caller
      description: |
        Returns the identity, the subscription levels, the add-ons, the entitlements, the permissions and
        the account flags of the caller. The response also gives the API key that authenticated the
        request. Each product API key works. The route does not check the REST permission, because a
        caller who lacks it is the caller who needs this answer. A per-IP limit applies, and the route
        answers 429 when one address asks too often. The server sets Cache-Control no-store.
      operationId: ApiWhoAmIV2
      tags:
        - Classic
        - State
        - Orderflow
        - Quant
        - Research
      security:
        - bearer_auth: []
      parameters:
        - $ref: "#/components/parameters/user_agent_header"
      responses:
        "200":
          description: The account and the API key of the caller.
          headers:
            Cache-Control:
              description: Always no-store.
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/who_am_i_response"
        "400":
          description: Bad Request. The User-Agent header is absent, or the Authorization header is absent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              examples:
                user_agent_missing:
                  value:
                    error: User-Agent not found.
                authorization_missing:
                  value:
                    error: Authorization header not found.
        "401":
          $ref: "#/components/responses/401"
        "403":
          description: Forbidden. The parent account suspended the commercial child seat.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error_response"
              example:
                error: Commercial child access is suspended.
        "429":
          $ref: "#/components/responses/429"
