      description: The metric to calculate. An exposure metric is a `dex_*`, `gex_*`, `tex_*`, `vex_*`, `rho_ex_*`, `vanna_ex_*`, `charm_ex_*`, `speed_ex_*`, `color_ex_*`, `ultima_ex_*`, `vomma_ex_*` or `zomma_ex_*` metric. The `strikes` and `type` parameters take a different default for an exposure metric.
    research_asset_descriptor:
      type: object
      description: Descriptor of a rendered chart asset. The png, jpeg, svg, pdf and webp formats return this descriptor.
      properties:
        url:
          type: string
          description: Relative path of the rendered asset.
        name:
          type: string
          description: File name of the rendered asset.
        content_type:
          type: string
          description: Media type of the rendered asset.
        description:
          type: string
          description: Text description of the chart.
        time_stamp:
          type: string
          description: Render time in the format YYYYMMDDTHHMMSS.
        model_ts:
          type: string
          nullable: true
          description: ISO-8601 timestamp of the options-chain snapshot that the chart used.
        model:
          type: string
          description: Volatility model of the request. Default gbR.
    data_category:
      type: string
      enum:
        - gex_full
        - gex_zero
        - gex_one
        - delta_zero
        - delta_one
        - gamma_zero
        - gamma_one
        - vanna_zero
        - vanna_one
        - charm_zero
        - charm_one
        - orderflow
      description: Data category name that the REST API and WebSocket hubs serve. The categories endpoint returns these names.
    category_orderflow:
      type: string
      enum:
        - orderflow
      description: |
        Orderflow data category:
        * `orderflow` - All orderflow metrics
    websocket_hub:
      type: string
      enum:
        - classic
        - state_gex
        - state_greeks_zero
        - state_greeks
        - state_greeks_one
        - orderflow
        - v2_classic
        - v2_state_gex
        - v2_state_greeks_zero
        - v2_state_greeks
        - v2_state_greeks_one
        - v2_orderflow
      description: WebSocket hub name used in a PATCH group replacement. New custom Quant clients should use the `v2_*` values. Current-generation values remain available for compatibility requests with no spot groups.
    websocket_group_name:
      type: string
      example: SPX_state_gamma_zero
      description: |
        Unprefixed analytics group name in `{ticker}_{package}_{category}` format, or an unprefixed spot group name in `{ticker}_spot` format. Standard analytics categories include `gex_full`, `gex_zero`, `gex_one`, `delta_zero`, `gamma_zero`, `vanna_zero`, `charm_zero`, `delta_one`, `gamma_one`, `vanna_one`, `charm_one`, and `orderflow`.

        Explicit-expiry analytics groups use a `YYYYMMDD` category suffix discovered from `GET /options/{ticker}/expiries`, for example `SPX_classic_gex_20260717`, `SPX_state_gex_20260717`, `SPX_state_gamma_20260717`, and `SPX_orderflow_20260717`. The date must be a listed expiry for the ticker. Synthetic futures tickers, such as ES_SPX and NQ_NDX, have no explicit-expiry groups.

        A V2 request must include one matching `{ticker}_spot` group for each analytics ticker. List each spot group once in a POST body. Repeat it for each applicable V2 hub in a PATCH body.
    websocket_v2_urls:
      type: object
      additionalProperties: false
      description: Map of authorized V2 hub names to signed WebSocket URLs. Spot uses these same connections and has no separate URL.
      properties:
        v2_classic:
          type: string
          format: uri
          description: Connection URL for the V2 Classic GEX hub.
        v2_state_gex:
          type: string
          format: uri
          description: Connection URL for the V2 State GEX Profile hub.
        v2_state_greeks_zero:
          type: string
          format: uri
          description: Connection URL for the V2 standard State Greeks 0DTE hub.
        v2_state_greeks:
          type: string
          format: uri
          description: Connection URL for V2 explicit-expiry State Greeks groups.
        v2_state_greeks_one:
          type: string
          format: uri
          description: Connection URL for the V2 State Greeks 1DTE+ hub.
        v2_orderflow:
          type: string
          format: uri
          description: Connection URL for the V2 Orderflow hub.
    websocket_legacy_urls:
      type: object
      additionalProperties: false
      description: Map of current-generation hub names to signed WebSocket URLs for the deprecated GET compatibility flow.
      properties:
        classic:
          type: string
          format: uri
          description: Connection URL for the current Classic GEX hub.
        state_gex:
          type: string
          format: uri
          description: Connection URL for the current State GEX Profile hub.
        state_greeks_zero:
          type: string
          format: uri
          description: Connection URL for the current standard State Greeks 0DTE hub.
        state_greeks:
          type: string
          format: uri
          description: Connection URL for current explicit-expiry State Greeks groups.
        state_greeks_one:
          type: string
          format: uri
          description: Connection URL for the current State Greeks 1DTE+ hub.
        orderflow:
          type: string
          format: uri
          description: Connection URL for the current Orderflow hub.
    websocket_negotiate_request:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/websocket_group_name"
          description: Complete initial analytics and spot group set. The server auto-joins these memberships on the returned V2 hub connections.
      example:
        groups:
          - SPX_classic_gex_full
          - SPX_state_gamma_zero
          - SPX_spot
          - ES_SPX_orderflow_orderflow
          - ES_SPX_spot
    websocket_negotiate_response:
      type: object
      required:
        - websocket_urls
      properties:
        websocket_urls:
          description: V2 URLs for an analytics-and-spot request, or current-generation URLs for a compatibility request with no spot groups.
          oneOf:
            - $ref: "#/components/schemas/websocket_v2_urls"
            - $ref: "#/components/schemas/websocket_legacy_urls"
      example:
        websocket_urls:
          v2_classic: wss://ws.gex.bot:443/client/hubs/v2_classic?access_token=example
          v2_state_gex: wss://ws.gex.bot:443/client/hubs/v2_state_gex?access_token=example
          v2_state_greeks_zero: wss://ws.gex.bot:443/client/hubs/v2_state_greeks_zero?access_token=example
          v2_state_greeks: wss://ws.gex.bot:443/client/hubs/v2_state_greeks?access_token=example
          v2_state_greeks_one: wss://ws.gex.bot:443/client/hubs/v2_state_greeks_one?access_token=example
          v2_orderflow: wss://ws.gex.bot:443/client/hubs/v2_orderflow?access_token=example
    websocket_group_update_item:
      type: object
      required:
        - hub
        - group
      properties:
        hub:
          $ref: "#/components/schemas/websocket_hub"
        group:
          $ref: "#/components/schemas/websocket_group_name"
    websocket_group_update_request:
      type: object
      required:
        - groups
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/websocket_group_update_item"
          description: Complete desired hub-and-group membership set. The server removes memberships that the body omits. New custom Quant clients should send V2 hubs and colocated spot memberships.
      example:
        groups:
          - hub: v2_classic
            group: SPX_classic_gex_full
          - hub: v2_classic
            group: SPX_spot
          - hub: v2_state_greeks_zero
            group: SPX_state_gamma_zero
          - hub: v2_state_greeks_zero
            group: SPX_spot
          - hub: v2_orderflow
            group: ES_SPX_orderflow_orderflow
          - hub: v2_orderflow
            group: ES_SPX_spot
    websocket_group_update_response:
      type: object
      required:
        - updated_groups
        - hubs
      properties:
        updated_groups:
          type: integer
          format: int32
          description: Total number of active hub-and-group memberships after replacement.
        hubs:
          type: object
          additionalProperties:
            type: integer
            format: int32
          description: Count of active group memberships by hub after replacement.
      example:
        updated_groups: 6
        hubs:
          v2_classic: 2
          v2_state_gex: 0
          v2_state_greeks_zero: 2
          v2_state_greeks: 0
          v2_state_greeks_one: 0
          v2_orderflow: 2
    websocket_legacy_negotiate_response:
      type: object
      required:
        - websocket_urls
        - prefix
      properties:
        websocket_urls:
          $ref: "#/components/schemas/websocket_legacy_urls"
        prefix:
          type: string
          description: Legacy prefix for the group name in a `joinGroup` message.
      example:
        websocket_urls:
          classic: wss://ws.gex.bot:443/client/hubs/classic?access_token=example
          state_gex: wss://ws.gex.bot:443/client/hubs/state_gex?access_token=example
          state_greeks_zero: wss://ws.gex.bot:443/client/hubs/state_greeks_zero?access_token=example
          state_greeks: wss://ws.gex.bot:443/client/hubs/state_greeks?access_token=example
          state_greeks_one: wss://ws.gex.bot:443/client/hubs/state_greeks_one?access_token=example
          orderflow: wss://ws.gex.bot:443/client/hubs/orderflow?access_token=example
        prefix: blue
    timestamp:
      $ref: "#/components/schemas/_int64"
    error_response:
      type: object
      properties:
        error:
          type: string
    min_dte:
      $ref: "#/components/schemas/_int"
    sec_min_dte:
      $ref: "#/components/schemas/_int"
    spot:
      type: number
      format: double
      nullable: true
      description: Spot price. Null when spot data is not available to the caller.
    zero_gamma:
      $ref: "#/components/schemas/_double"
    major_pos_vol:
      $ref: "#/components/schemas/_double"
    major_long_gamma:
      $ref: "#/components/schemas/_double"
    major_short_gamma:
      $ref: "#/components/schemas/_double"
    major_pos_oi:
      $ref: "#/components/schemas/_double"
    major_neg_vol:
      $ref: "#/components/schemas/_double"
    major_neg_oi:
      $ref: "#/components/schemas/_double"
    mini_contracts:
      type: array
      description: Strike rows. Each row is [strike, call_ivol, put_ivol, greek value, priors array, put classified volume, put volume priors]. In public API responses the put classified volume is 0 and the put volume priors are null.
      items:
        type: array
    strikes:
      type: array
      description: Strike rows. Each row is [strike, gex_vol, gex_oi, priors]. priors holds the 1, 5, 10, 15 and 30 minute lookback GEX values.
      items:
        type: array
        minItems: 4
        maxItems: 4
        items:
          oneOf:
            - type: number
              format: double
            - type: array
              items:
                type: number
                format: double
    sum_gex_vol:
      $ref: "#/components/schemas/_double"
    sum_gex_oi:
      $ref: "#/components/schemas/_double"
    delta_risk_reversal:
      $ref: "#/components/schemas/_double"
    max_priors:
      type: array
      description: Six [strike, gex] pairs. Entry 0 is the current pair. Entries 1 to 5 are the 1, 5, 10, 15 and 30 minute lookbacks. The array is empty when the producer omits the field.
      maxItems: 6
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: number
          format: double
    who_am_i_response:
      type: object
      description: The self-identification projection of the caller. The server omits each null field.
      required:
        - _id
        - role
        - level
        - max_level
        - addons
        - entitlements
        - permissions
        - account
      properties:
        _id:
          type: string
          description: The user identifier.
        role:
          type: string
          description: The role of the account.
        level:
          type: array
          items:
            type: string
          description: Each subscription level that the account holds.
        max_level:
          type: string
          description: The highest subscription level that the account holds. Package access checks this value.
        addons:
          type: array
          items:
            type: string
          description: Each subscription add-on of the account.
        entitlements:
          type: object
          description: The paid access of the account for each product family.
          properties:
            gexbot:
              type: object
              properties:
                level:
                  type: string
                addons:
                  type: array
                  items:
                    type: string
            skewbot:
              type: object
              properties:
                active:
                  type: boolean
                tier:
                  type: string
        permissions:
          type: array
          items:
            type: string
          description: One entry for each permission flag that the account holds.
        account:
          type: object
          description: Account-shape flags. Each flag explains an authorization result that the levels alone do not.
          required:
            - commercial
            - commercial_delegate
            - display_use
            - child
            - managed
            - delegated
          properties:
            commercial:
              type: boolean
            commercial_delegate:
              type: boolean
            display_use:
              type: boolean
            child:
              type: boolean
            managed:
              type: boolean
            delegated:
              type: boolean
        api_key:
          type: object
          description: The API key that authenticated the request, never another key of the caller. The server omits the field for another authentication scheme.
          required:
            - id
            - product
            - created_at
          properties:
            id:
              type: string
              description: A masked identifier in the form {product}_{integration}_...XXXX.
              example: gexbot_sierra_...AbCd
            label:
              type: string
              nullable: true
              description: The label that the owner gave the key.
            product:
              type: string
              description: The product of the key. The product decides which API surfaces accept the key.
            integration:
              type: string
              description: The integration of a scoped key. The server omits the field for an unscoped key.
            parent_user_id:
              type: string
              description: The parent account of a child seat. The server omits the field for a parent account.
            created_at:
              type: string
              format: date-time
            expires_at:
              type: string
              format: date-time
            rotated_at:
              type: string
              format: date-time
              description: The rotation time. A rotated key authenticates until it expires, and the owner cannot manage it.
        created:
          type: string
          format: date-time
          nullable: true
          description: The UTC time that the account was created.
  parameters:
    research_ticker_in_path:
      name: ticker
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/research_ticker"
    option_ticker_in_path:
      name: ticker
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/option_ticker"
      description: Canonical option-owning ticker. Use standard or Quant-only stock/index tickers.
    ticker_in_path:
      name: ticker
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/ticker"
    category_in_path:
      name: category
      in: path
      required: true
      schema:
        oneOf:
          - $ref: "#/components/schemas/category_classic"
          - $ref: "#/components/schemas/category_state"
          - $ref: "#/components/schemas/category_orderflow"
    classic_category_in_path:
      name: category
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/category_classic"
    gex_category_in_path:
      name: category
      in: path
      required: true
      description: GEX aggregation category. The majors and max change routes accept gex_full, gex_zero, gex_one, or the aliases full, zero, one.
      schema:
        $ref: "#/components/schemas/category_classic"
    orderflow_category_in_path:
      name: category
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/category_orderflow"
    state_category_in_path:
      name: category
      in: path
      required: true
      schema:
        oneOf:
          - $ref: "#/components/schemas/category_classic"
          - $ref: "#/components/schemas/category_state"
    package_in_path:
      name: package
      in: path
      required: true
      schema:
        type: string
        enum:
          - classic
          - state
          - orderflow
        description: |
          Data package type:
          * `classic` - Classic subscription data
          * `state` - State subscription data
          * `orderflow` - Orderflow subscription data
    user_agent_header:
      name: User-Agent
      in: header
      required: true
      schema:
        type: string
      description: Identify your client application.
    accept_header:
      name: Accept
      in: header
      required: true
      schema:
        type: string
        enum:
          - application/json
      description: Set to "application/json".
  securitySchemes:
    bearer_auth:
      type: http
      scheme: bearer
  responses:
    "401":
      description: Unauthorized. The API key is missing, unknown, expired or revoked. The body can be empty.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
    "403":
      description: Forbidden. The key, the subscription level or the client is not permitted. The body can be empty.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
    "404":
      description: Not Found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
    "400":
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
    "409":
      description: Conflict. The caller has no live connection on a hub that the request names. Negotiate with POST and connect first.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
          example:
            error: 'No active websocket connection for: <hubs>. Negotiate with POST and connect to the returned hub urls before updating groups.'
    "429":
      description: Rate limit exceeded.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
          example:
            error: Rate limit exceeded.
    "500":
      description: Internal Server Error. The server could not read the chart data.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/error_response"
          example:
            error: Failed to get chart data.
security:
  - bearer_auth: []
tags:
  - name: Public
    description: Endpoints that need no API key, such as the ticker lists and the category list.
  - name: Classic
    description: Available with Classic Subscription
  - name: State
    description: Available with State Subscription
  - name: Orderflow
    description: Available with Orderflow Subscription
  - name: Quant
    description: Available with Quant Subscription
  - name: Research
    description: Available with Research Addon. Provides chart and analytical data for options metrics across various formats and views.
